name: CI

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Testes unitários (sem banco de dados)
        run: npm test
      - name: Conferência do formato da entrega
        run: npm run verificar
